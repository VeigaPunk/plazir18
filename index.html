<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agent Wall</title>
<style>
  :root { --bg:#0b0e14; --card:#161b26; --text:#e7ecf5; --muted:#8b95ab; --attached:#3ee08b; }
  * { box-sizing:border-box; font-family:"Segoe UI",Avenir,sans-serif; }
  body { margin:0; min-height:100vh; background:var(--bg); color:var(--text); padding:16px; }
  h1 { display:inline-flex; align-items:center; gap:8px; font-size:1rem; font-weight:600; margin:0 0 12px;
       color:var(--muted); letter-spacing:.04em; text-transform:uppercase; }
  #pipBtn { background:#2a3040; color:var(--text); border:1px solid #3a4256; border-radius:8px;
            padding:6px 12px; cursor:pointer; float:right; }
  #pipBtn:hover { background:#333a4d; }
  .stale-badge { font-size:.72rem; text-transform:none; letter-spacing:0; color:#ffb4b4;
                 padding:2px 8px; border:1px solid #5c2a2a; border-radius:999px; background:#2a1616; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:10px; clear:both; margin-top:12px; }
  .grid.stale .tile { opacity:.45; filter:grayscale(.4); transition:opacity .3s; }
  .tile { position:relative; background:var(--card); border:1px solid #232a38; border-radius:10px;
          min-height:150px; overflow:hidden; cursor:pointer; user-select:none; }
  .tile.attached { border-color:var(--attached); box-shadow:0 0 10px rgba(62,224,139,.25); }
  .pane { margin:0; padding:8px 8px 22px; height:150px; overflow:hidden;
          font-family:"Cascadia Code","Consolas",monospace; font-size:.66rem; line-height:1.25;
          color:#c9d6e6; white-space:pre; }
  .nameplate { position:absolute; left:6px; bottom:5px; font-size:.72rem; font-weight:600; color:#fff;
               background:rgba(0,0,0,.55); padding:1px 7px; border-radius:6px; pointer-events:none; }
  .kill-confirm { position:absolute; inset:0; background:rgba(20,4,4,.9); display:flex; flex-direction:column;
                  align-items:center; justify-content:center; gap:8px; font-size:.8rem; text-align:center; }
  .kill-confirm button { padding:4px 12px; border-radius:6px; border:0; cursor:pointer; font-size:.78rem; }
  .kill-confirm .yes { background:#e0453e; color:#fff; }
  .kill-confirm .no { background:#3a4256; color:#fff; }
  .empty { color:var(--muted); font-size:.85rem; }
</style>
</head>
<body>
<h1>Agent Wall <span id="staleBadge" class="stale-badge" hidden></span></h1>
<button id="pipBtn">Pop out (PiP)</button>
<div id="grid" class="grid"><p class="empty">loading…</p></div>

<script>
const POLL_MS = 1000;
const MAX_BACKOFF_MS = 10000;

const grid = document.getElementById("grid");
const staleBadge = document.getElementById("staleBadge");
let pipWindow = null;
let lastSessions = [];
let lastSuccess = Date.now();
let backoff = POLL_MS;
let pendingKill = null; // session name currently showing the inline kill-confirm

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, ch => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[ch]));
}

function tileHTML(s) {
  const cls = "tile" + (s.attached ? " attached" : "");
  const pane = escapeHtml((s.pane || "").replace(/\n$/, ""));
  const confirm = pendingKill === s.name
    ? `<div class="kill-confirm">Kill "${escapeHtml(s.name)}"?
         <div>
           <button type="button" data-action="kill-yes">Yes, kill it</button>
           <button type="button" data-action="kill-no">Cancel</button>
         </div>
       </div>`
    : "";
  return `<div class="${cls}" data-session="${escapeHtml(s.name)}">
    <pre class="pane">${pane}</pre>
    <div class="nameplate">${escapeHtml(s.name)}</div>
    ${confirm}
  </div>`;
}

function renderGrid(sessions) {
  grid.innerHTML = sessions.length
    ? sessions.map(tileHTML).join("")
    : '<p class="empty">no tmux sessions — F7 tmux ON, then F6</p>';
}

function mirrorToPip() {
  if (!pipWindow || pipWindow.closed) return;
  const dst = pipWindow.document.getElementById("grid");
  if (!dst) return;
  dst.innerHTML = grid.innerHTML;
  dst.classList.toggle("stale", grid.classList.contains("stale"));
}

function setStale(isStale) {
  grid.classList.toggle("stale", isStale);
  if (isStale) {
    staleBadge.textContent = `stale ${Math.round((Date.now() - lastSuccess) / 1000)}s`;
    staleBadge.hidden = false;
  } else {
    staleBadge.hidden = true;
  }
}

async function doTp(name) {
  try {
    await fetch("/tp", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name }),
    });
  } catch (e) { /* best effort — next poll's tile state is the source of truth */ }
}

async function doKill(name) {
  try {
    await fetch("/kill", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name }),
    });
  } catch (e) { /* best effort */ }
  // optimistic: drop it now instead of waiting up to POLL_MS for confirmation
  lastSessions = lastSessions.filter(s => s.name !== name);
  pendingKill = null;
  renderGrid(lastSessions);
  mirrorToPip();
}

// Event delegation on the #grid container: it is never itself replaced
// (only its innerHTML is), and the same handlers are wired into the PiP
// document's #grid too, since a documentPictureInPicture window clones
// markup but never listeners.
function handleGridClick(e) {
  const action = e.target.closest("[data-action]");
  const tile = e.target.closest("[data-session]");
  if (!tile) return;
  const name = tile.dataset.session;
  if (action) {
    if (action.dataset.action === "kill-yes") doKill(name);
    else if (action.dataset.action === "kill-no") { pendingKill = null; renderGrid(lastSessions); mirrorToPip(); }
    return;
  }
  if (pendingKill === name) return; // ignore stray clicks while confirming
  doTp(name);
}

function handleGridContextMenu(e) {
  e.preventDefault();
  const tile = e.target.closest("[data-session]");
  if (!tile) return;
  pendingKill = tile.dataset.session;
  renderGrid(lastSessions);
  mirrorToPip();
}

grid.addEventListener("click", handleGridClick);
grid.addEventListener("contextmenu", handleGridContextMenu);

async function poll() {
  try {
    const res = await fetch("/sessions", { cache: "no-store" });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    lastSessions = await res.json();
    lastSuccess = Date.now();
    backoff = POLL_MS;
    setStale(false);
  } catch (e) {
    backoff = Math.min(backoff * 2, MAX_BACKOFF_MS);
    setStale(true);
    // keep rendering lastSessions (dimmed via .stale) instead of blanking tiles
  }
  renderGrid(lastSessions);
  mirrorToPip();
  setTimeout(poll, backoff);
}

document.getElementById("pipBtn").addEventListener("click", async () => {
  if (!("documentPictureInPicture" in window)) {
    alert("documentPictureInPicture not supported in this browser — try Chrome 116+.");
    return;
  }
  pipWindow = await window.documentPictureInPicture.requestWindow({ width: 520, height: 380 });
  const style = pipWindow.document.createElement("style");
  style.textContent = document.querySelector("style").textContent + "body{padding:8px}";
  pipWindow.document.head.appendChild(style);
  const wrap = pipWindow.document.createElement("div");
  wrap.id = "grid";
  wrap.className = "grid";
  pipWindow.document.body.appendChild(wrap);
  wrap.addEventListener("click", handleGridClick);
  wrap.addEventListener("contextmenu", handleGridContextMenu);
  mirrorToPip();
});

poll();
</script>
</body>
</html>
