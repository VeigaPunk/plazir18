[package]
name = "agent-wall"
version = "0.2.1"
edition = "2024"
description = "An 18-panel tmux agent dashboard for Omarchy and other Linux desktops"
license = "MIT"
repository = "https://github.com/VeigaPunk/plazir18"
homepage = "https://github.com/VeigaPunk/plazir18"

[dependencies]
crossterm = "0.29"
eframe = "0.35.0"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tui-term = "0.3"
vt100 = "0.16"
